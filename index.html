<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑盒子維修中心 - 官方網站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    
    <style>
        :root {
            --primary-black: #1a1a1a;
            --secondary-black: #2d2d2d;
            --gold-accent: #d4af37;
            --bg-light: #f9f9f9;
            --text-dark: #333333;
            --text-muted: #999999;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

        /* --- 導覽列 --- */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 85px;
            background-color: #ffffff; box-shadow: var(--shadow);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-toggle { font-size: 24px; color: var(--primary-black); cursor: pointer; background: none; border: none; }
        .logo-img { height: 54px; width: auto; object-fit: contain; display: block; }

        .header-right { display: flex; gap: 15px; }
        .nav-btn {
            display: flex; justify-content: center; align-items: center;
            width: 42px; height: 42px; border-radius: 50%;
            background-color: var(--primary-black); color: #ffffff;
            text-decoration: none; font-size: 18px; transition: var(--transition);
        }
        .nav-btn:hover { background-color: var(--gold-accent); transform: translateY(-2px); }

        /* --- 側邊選單 (已再度縮窄至 220px) --- */
        .sidebar {
            position: fixed; top: 0; 
            left: -220px; /* 修改：配合寬度調整隱藏定位 */
            width: 220px; /* 修改：從 260px 再度縮窄至 220px */
            height: 100%;
            background-color: #ffffff; z-index: 2000; transition: var(--transition);
            padding: 24px; box-shadow: 5px 0 25px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }
        
        /* 修改：Logo 改為靠左對齊並留出舒適的微幅邊距 */
        .sidebar-header { 
            display: flex; 
            justify-content: flex-start; /* 修改：由 center 改為靠左對齊 */
            padding-left: 8px; /* 新增：讓圖片與下方文字標籤對齊一致 */
            padding-bottom: 20px; 
            margin-bottom: 20px; 
            border-bottom: 1px solid #f0f0f0; 
        }
        .sidebar-logo { height: 50px; width: auto; object-fit: contain; display: block; }

        .sidebar-content { display: flex; flex-direction: column; gap: 24px; }
        .menu-group { display: flex; flex-direction: column; gap: 8px; }
        .group-title { font-size: 13px; color: var(--text-muted); letter-spacing: 1px; padding-left: 8px; }
        .menu-item { color: var(--text-dark); text-decoration: none; font-size: 16px; padding: 8px; border-radius: 6px; transition: var(--transition); cursor: pointer; }
        .menu-item:hover { color: var(--gold-accent); background-color: #fcfbf7; padding-left: 14px; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.3); z-index: 1500; display: none; }
        .overlay.active { display: block; }

        /* --- 頁面內容切換核心 --- */
        main { 
            margin-top: 85px; 
            padding: 5px 20px 40px 20px; 
            max-width: 1200px; 
            margin-left: auto; 
            margin-right: auto; 
            min-height: calc(100vh - 185px); 
        }
        
        .content-section { display: none; animation: fadeIn 0.4s ease forwards; }
        .content-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 共用容器樣式 --- */
        .page-container { 
            background: transparent; 
            padding: 15px 0 20px 0; 
            text-align: center; 
        }

        .page-header { 
            font-size: 28px; 
            font-weight: 700; 
            margin-bottom: 6px; 
            text-align: center; 
            color: var(--primary-black); 
        }

        /* 服務流程按鈕排版 */
        .process-tabs { 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            margin-bottom: 20px; 
            flex-wrap: nowrap; 
        }
        
        .tab-btn { 
            background: var(--primary-black); 
            color: #fff; 
            border: 2px solid var(--primary-black); 
            padding: 6px 14px; 
            font-size: 18px; 
            border-radius: 40px; 
            cursor: pointer; 
            transition: var(--transition); 
            letter-spacing: 1px;
            white-space: nowrap; 
        }
        .tab-btn.active { border-color: var(--gold-accent); color: var(--gold-accent); font-weight: 700; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15); }
        .tab-btn:hover { transform: translateY(-2px); background-color: var(--secondary-black); }

        /* 圖片外框維持 600px */
        .img-box { max-width: 600px; margin: 0 auto; }
        .display-img { width: 100%; height: auto; display: none; }
        .display-img.active { display: block; animation: fadeIn 0.4s; }

        /* --- 價格查詢：滑動式設備選擇器 --- */
        .price-slider-area {
            position: relative;
            width: 100%;
            max-width: 1080px;
            margin: 22px auto 16px auto;
            padding: 18px 0 36px 0;
            overflow: hidden;
            user-select: none;
        }

        .price-viewport {
            width: 100%;
            overflow: hidden;
            padding: 18px 0 38px 0;
            cursor: grab;
            touch-action: pan-y;
        }

        .price-viewport.dragging { cursor: grabbing; }

        .price-center-frame {
            position: absolute;
            left: 50%;
            top: 29px;
            width: 118px;
            height: 118px;
            border-radius: 50%;
            border: 7px solid #f7b500;
            box-shadow: inset 0 0 0 4px #ffffff, 0 12px 28px rgba(0, 0, 0, 0.12);
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 5;
        }

        .price-track {
            display: flex;
            align-items: center;
            gap: 54px;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            transition: transform 0.72s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .price-viewport.dragging .price-track {
            transition: none;
        }

        .price-device-btn {
            flex: 0 0 104px;
            width: 104px;
            height: 104px;
            border-radius: 50%;
            border: 6px solid transparent;
            background: #f7b500;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.34;
            transition: opacity 0.42s ease, transform 0.42s ease, border-color 0.42s ease, box-shadow 0.42s ease, background-color 0.42s ease;
            box-shadow: none;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .price-device-btn[data-price="start"] {
            background: #aaaaaa;
            opacity: 0.72;
        }

        .price-device-btn iconify-icon {
            font-size: 48px;
            line-height: 1;
            color: currentColor;
            pointer-events: none;
        }

        .price-device-btn:hover {
            opacity: 0.82;
            transform: translateY(-2px);
        }

        .price-device-btn.active {
            opacity: 1;
            transform: scale(1.08);
            border-color: transparent;
            box-shadow: none;
        }

        .price-device-btn.active[data-price="start"] {
            background: #aaaaaa;
        }

        .price-device-btn.active:not([data-price="start"]) {
            background: #f7b500;
        }

        .price-device-btn.active iconify-icon { font-size: 52px; }

        .price-device-btn::after {
            content: attr(data-label);
            position: absolute;
            left: 50%;
            bottom: -34px;
            transform: translateX(-50%);
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.36s ease, color 0.36s ease;
        }

        .price-device-btn.active::after {
            opacity: 1;
            color: var(--primary-black);
            font-weight: 500;
        }

        .price-result-box {
            max-width: 600px;
            margin: 20px auto 0 auto;
            min-height: 120px;
        }

        .price-img {
            width: 100%;
            height: auto;
            display: none;
            animation: fadeIn 0.4s;
        }

        .price-img.active { display: block; }

        .price-placeholder {
            display: none;
            padding: 46px 18px;
            border-radius: 22px;
            background: #ffffff;
            color: var(--text-muted);
            box-shadow: var(--shadow);
            font-size: 16px;
        }

        .price-placeholder.active { display: block; }

        @media (max-width: 768px) {
            .price-slider-area { margin-top: 12px; padding-bottom: 28px; }
            .price-track { gap: 34px; }
            .price-device-btn {
                flex-basis: 86px;
                width: 86px;
                height: 86px;
                border-width: 5px;
            }
            .price-device-btn iconify-icon { font-size: 40px; }
            .price-device-btn.active iconify-icon { font-size: 44px; }
            .price-device-btn::after { bottom: -30px; font-size: 12px; }
            .price-center-frame {
                top: 30px;
                width: 98px;
                height: 98px;
                border-width: 6px;
                box-shadow: inset 0 0 0 3px #ffffff, 0 10px 22px rgba(0, 0, 0, 0.10);
            }
        }

        /* --- 其他樣式 --- */
        .empty-state { text-align: center; padding: 100px 0; color: var(--text-muted); }

        footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-toggle" id="openMenu"><i class="fa-solid fa-bars"></i></button>
            <div class="logo-container"><img src="site logo.png" alt="Logo" class="logo-img"></div>
        </div>
        <div class="header-right">
            <a href="https://blackboxrepair.github.io/membership/" class="nav-btn"><i class="fa-solid fa-user"></i></a>
            <a href="https://blackboxrepair.github.io/bookingonline/" class="nav-btn"><i class="fa-solid fa-calendar-check"></i></a>
        </div>
    </header>

    <div class="overlay" id="overlay"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="site logo.png" class="sidebar-logo">
        </div>
        <div class="sidebar-content">
            <div class="menu-group">
                <div class="menu-item" onclick="navigateTo('home')">首頁</div>
            </div>
            <div class="menu-group">
                <div class="group-title">服務項目</div>
                <div class="menu-item" onclick="navigateTo('process')">服務流程</div>
                <div class="menu-item" onclick="navigateTo('prices')">價格查詢</div>
            </div>
            <div class="menu-group">
                <div class="group-title">實作紀錄</div>
                <div class="menu-item" onclick="navigateTo('cases')">維修案例</div>
            </div>
            <div class="menu-group">
                <div class="group-title">門市資訊</div>
                <div class="menu-item" onclick="navigateTo('locations')">服務站點</div>
            </div>
        </div>
    </nav>

    <main>
        <section id="section-home" class="content-section">
            <div class="empty-state">
                <h2 class="page-header">歡迎來到黑盒子維修中心</h2>
                <p>請從左側選單選擇您需要的服務</p>
            </div>
        </section>

        <section id="section-process" class="content-section">
            <div class="page-container">
                <h2 class="page-header">服務流程</h2>
                <div class="process-tabs">
                    <button class="tab-btn active" onclick="changeProcessImg('phone', this)">手機維修</button>
                    <button class="tab-btn" onclick="changeProcessImg('notebook', this)">筆電維修</button>
                    <button class="tab-btn" onclick="changeProcessImg('data', this)">資料救援</button>
                </div>
                <div class="img-box">
                    <img src="phone process.png" id="img-process-phone" class="display-img active">
                    <img src="notebook process.png" id="img-process-notebook" class="display-img">
                    <img src="data process.png" id="img-process-data" class="display-img">
                </div>
            </div>
        </section>

        <section id="section-prices" class="content-section">
            <div class="page-container">
                <h2 class="page-header">價格查詢</h2>
                
                <div class="price-slider-area" id="priceSliderArea">
                    <div class="price-viewport" id="priceViewport" aria-label="滑動選擇設備">
                        <div class="price-track" id="priceTrack">
                            <button type="button" class="price-device-btn" data-price="data" data-label="資料救援" aria-label="資料救援">
                                <iconify-icon icon="mdi:database-search"></iconify-icon>
                            </button>
                            <button type="button" class="price-device-btn" data-price="memory" data-label="iPhone擴容" aria-label="iPhone擴容">
                                <iconify-icon icon="mdi:memory"></iconify-icon>
                            </button>
                            <button type="button" class="price-device-btn" data-price="applewatch" data-label="Apple Watch" aria-label="Apple Watch">
                                <iconify-icon icon="mdi:watch-variant"></iconify-icon>
                            </button>
                            <button type="button" class="price-device-btn active" data-price="start" data-label="啟動" aria-label="啟動">
                                <iconify-icon icon="mdi:power"></iconify-icon>
                            </button>
                            <button type="button" class="price-device-btn" data-price="switch" data-label="Switch" aria-label="Switch">
                                <iconify-icon icon="mdi:nintendo-switch"></iconify-icon>
                            </button>
                            <button type="button" class="price-device-btn" data-price="vacuum" data-label="Dyson吸塵器" aria-label="Dyson吸塵器">
                                <iconify-icon icon="mdi:vacuum"></iconify-icon>
                            </button>
                            <button type="button" class="price-device-btn" data-price="hairdryer" data-label="Dyson吹風機" aria-label="Dyson吹風機">
                                <iconify-icon icon="mdi:hair-dryer"></iconify-icon>
                            </button>
                        </div>
                    </div>
                    <div class="price-center-frame" aria-hidden="true"></div>
                </div>

                <div class="price-result-box">
                    <div id="pricePlaceholder" class="price-placeholder active">請左右滑動，將設備圖示移動到中間圓框內查看報價。</div>
                    <img src="Price_applewatch.PNG" id="img-price-applewatch" class="price-img" alt="Apple Watch 維修報價">
                    <img src="Price_memory.PNG" id="img-price-memory" class="price-img" alt="iPhone 擴容報價">
                </div>
            </div>
        </section>

        <section id="section-cases" class="content-section">
            <h2 class="page-header">維修案例</h2>
            <div class="empty-state">維修案例文章準備中...</div>
        </section>

        <section id="section-locations" class="content-section">
            <h2 class="page-header">服務站點</h2>
            <div class="empty-state">門市據點載入中...</div>
        </section>
    </main>

    <footer>&copy; 2026 BLACK BOX 維修中心. All Rights Reserved.</footer>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        document.getElementById('openMenu').onclick = () => { sidebar.classList.add('active'); overlay.classList.add('active'); };
        overlay.onclick = () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); };

        function navigateTo(sectionId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            const targetSection = document.getElementById(`section-${sectionId}`);
            if (targetSection) {
                targetSection.classList.add('active');
                window.location.hash = sectionId;
            }
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            window.scrollTo(0, 0);
            if (sectionId === 'prices') {
                requestAnimationFrame(() => updatePriceSlider(currentPriceIndex));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const currentHash = window.location.hash.replace('#', '');
            if (currentHash && document.getElementById(`section-${currentHash}`)) {
                navigateTo(currentHash);
            } else {
                navigateTo('home');
            }
        });

        function changeProcessImg(type, btn) {
            document.querySelectorAll('#section-process .tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#section-process .display-img').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`img-process-${type}`).classList.add('active');
        }

        const priceTrack = document.getElementById('priceTrack');
        const priceViewport = document.getElementById('priceViewport');
        const priceButtons = Array.from(document.querySelectorAll('.price-device-btn'));
        const pricePlaceholder = document.getElementById('pricePlaceholder');
        let currentPriceIndex = 3;
        let currentTranslateX = 0;
        let dragStartX = 0;
        let dragDeltaX = 0;
        let isDraggingPrice = false;
        let priceMoveFrame = null;

        function getCenteredTranslate(index) {
            const targetIndex = Math.max(0, Math.min(index, priceButtons.length - 1));
            const activeButton = priceButtons[targetIndex];
            const viewportWidth = priceViewport.clientWidth;
            const activeCenter = activeButton.offsetLeft + (activeButton.offsetWidth / 2);
            return (viewportWidth / 2) - activeCenter;
        }

        function setPriceTrackPosition(x) {
            currentTranslateX = x;
            priceTrack.style.transform = `translate3d(${x}px, 0, 0)`;
        }

        function getPriceButtonStep() {
            if (priceButtons.length < 2) return priceButtons[0]?.offsetWidth || 104;
            return Math.abs(priceButtons[1].offsetLeft - priceButtons[0].offsetLeft) || 104;
        }

        function updatePriceSlider(index) {
            if (!priceTrack || !priceViewport || priceButtons.length === 0) return;

            currentPriceIndex = Math.max(0, Math.min(index, priceButtons.length - 1));

            priceButtons.forEach((button, buttonIndex) => {
                button.classList.toggle('active', buttonIndex === currentPriceIndex);
            });

            setPriceTrackPosition(getCenteredTranslate(currentPriceIndex));
            updatePriceResult(priceButtons[currentPriceIndex].dataset.price);
        }

        function updatePriceResult(type) {
            document.querySelectorAll('#section-prices .price-img').forEach(img => img.classList.remove('active'));
            pricePlaceholder.classList.remove('active');

            if (type === 'applewatch') {
                document.getElementById('img-price-applewatch').classList.add('active');
            } else if (type === 'memory') {
                document.getElementById('img-price-memory').classList.add('active');
            } else {
                pricePlaceholder.classList.add('active');
                pricePlaceholder.textContent = type === 'start'
                    ? '請左右滑動，將設備圖示移動到中間圓框內查看報價。'
                    : '此項目的報價圖片準備中。';
            }
        }

        function movePriceSlider(direction) {
            updatePriceSlider(currentPriceIndex + direction);
        }

        function initPriceSlider() {
            if (!priceTrack || !priceViewport) return;

            priceButtons.forEach((button, index) => {
                button.addEventListener('click', () => updatePriceSlider(index));
            });

            priceViewport.addEventListener('pointerdown', (event) => {
                isDraggingPrice = true;
                dragStartX = event.clientX;
                dragDeltaX = 0;
                priceViewport.classList.add('dragging');
                priceViewport.setPointerCapture(event.pointerId);
            });

            priceViewport.addEventListener('pointermove', (event) => {
                if (!isDraggingPrice) return;
                dragDeltaX = event.clientX - dragStartX;

                if (Math.abs(dragDeltaX) > 4) event.preventDefault();
                if (priceMoveFrame) cancelAnimationFrame(priceMoveFrame);

                priceMoveFrame = requestAnimationFrame(() => {
                    setPriceTrackPosition(getCenteredTranslate(currentPriceIndex) + dragDeltaX);
                });
            });

            priceViewport.addEventListener('pointerup', () => {
                if (!isDraggingPrice) return;
                isDraggingPrice = false;
                priceViewport.classList.remove('dragging');

                const step = getPriceButtonStep();
                let targetIndex = currentPriceIndex - Math.round(dragDeltaX / step);

                if (Math.abs(dragDeltaX) > 28 && targetIndex === currentPriceIndex) {
                    targetIndex += dragDeltaX < 0 ? 1 : -1;
                }

                updatePriceSlider(targetIndex);
            });

            priceViewport.addEventListener('pointercancel', () => {
                isDraggingPrice = false;
                priceViewport.classList.remove('dragging');
                updatePriceSlider(currentPriceIndex);
            });

            window.addEventListener('resize', () => updatePriceSlider(currentPriceIndex));
            requestAnimationFrame(() => updatePriceSlider(3));
        }

        window.addEventListener('load', initPriceSlider);
    </script>
</body>
</html>
